<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ececec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="kz-quiz">
<title>kz-quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#ececec;--card:#fff;--mute:#8a8a8a;--soft:#f1f1f1;--line:#e3e3e3;--ok:#1f9d55;--bad:#d64545;--r:22px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#000;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
main{max-width:560px;margin:0 auto;padding:24px 16px 120px;display:flex;flex-direction:column;gap:12px}
a{color:inherit}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px;gap:12px}
.head p{color:var(--mute);font-size:14px;margin-top:4px}
.pill{text-decoration:none;font-size:12px;font-weight:700;border:2px solid #000;border-radius:999px;padding:5px 12px;white-space:nowrap}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sec{margin:12px 4px 0}
.card{background:var(--card);border-radius:var(--r);padding:20px;text-decoration:none;display:block}
.dark{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-top:10px}
.num small{font-size:15px;color:var(--mute);font-weight:600;letter-spacing:0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#000;color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.btn.light{background:var(--soft);color:#000}
.dark .btn{background:#fff;color:#000}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;border-radius:999px}
.btn:active,.opt:active,.card:active,.tile:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* стрик и главная */
.huge{font-size:72px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:8px}
.huge small{font-size:18px;font-weight:600;color:#9a9a9a;letter-spacing:0}
.week{display:flex;justify-content:space-between;margin-top:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#777;text-transform:uppercase;font-weight:700}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid #333;display:grid;place-items:center;font-style:normal}
.wd.today{color:#fff}.wd.today i{border-color:#fff}
.wd.on i{background:#fff;border-color:#fff}
.wd.on i{color:#000}
.ic{flex:none;vertical-align:-.2em}
.cta h2{font-size:22px;font-weight:800;margin:8px 0 4px;letter-spacing:-.01em}
.cta p{color:var(--mute);font-size:14px;margin-bottom:16px}
.cta .btn+.btn{margin-top:8px}
.w[onclick]{cursor:pointer}
.w.cur b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#000;margin-right:8px;vertical-align:2px}
.dw{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dw span{padding:6px 12px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px;color:#b5b5b5}
.dw span.on{background:#000;color:#fff}
.stats{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap}
.stats div{font-size:12px;color:#9a9a9a}
.stats b{display:block;font-size:22px;color:#fff}

/* карточки */
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.x{font-size:20px;text-decoration:none;font-weight:700;width:36px;height:36px;display:grid;place-items:center;background:#fff;border-radius:50%;flex:none}
.bar{flex:1;height:8px;background:#d8d8d8;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#000;transition:width .3s}
.flip{perspective:1200px;height:min(56dvh,380px);cursor:pointer;user-select:none}
.flip>div{position:relative;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .hint{position:absolute;bottom:18px;font-size:13px;color:var(--mute)}
.big{font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}

/* квиз */
.q{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;font:inherit;font-weight:600;cursor:pointer;color:#000}
#opts{display:flex;flex-direction:column;gap:10px}
#opts.lock{pointer-events:none}
.opt.ok{border-color:var(--ok);background:#e8f6ee}
.opt.bad{border-color:var(--bad);background:#fdecec}
input{width:100%;font:inherit;font-size:20px;padding:16px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;outline:none;color:#000}
input:focus{border-color:#000}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.keys button{flex:1;min-width:34px;padding:10px 0;border:0;border-radius:10px;background:#fff;font:inherit;font-size:18px;font-weight:600;cursor:pointer;color:#000}
.card .keys button{background:var(--soft)}
.fb{padding:14px 18px;border-radius:16px;font-weight:600;margin-bottom:10px}
.fb.good{background:#e8f6ee;color:var(--ok)}
.fb.wrong{background:#fdecec;color:var(--bad)}
.fb b{color:#000}
#fb .ghost{margin-top:4px}

/* практика */
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;gap:4px}
.card .seg{background:var(--soft)}
.seg>*{flex:1;text-align:center;padding:10px 6px;border-radius:10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:0;background:none;color:#000}
.seg .on,.seg label:has(input:checked){background:#000;color:#fff}
.seg input{display:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;min-height:136px}
.mode i{font-style:normal;width:42px;height:42px;border-radius:12px;background:#000;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800;margin-bottom:auto}
.mode.dark i{background:#fff;color:#000}
.mode b{font-size:17px;margin-top:14px}
.mode span{font-size:13px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-height:92px;border:2px solid transparent;border-radius:16px;background:#fff;font:inherit;font-weight:700;font-size:15px;padding:8px;cursor:pointer;color:#000;transition:opacity .25s,transform .25s;overflow-wrap:anywhere}
.tile.sel{border-color:#000}
.tile.miss{border-color:var(--bad);background:#fdecec;animation:shake .3s}
.tile.gone{opacity:0;transform:scale(.8);pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* финальные экраны */
.splash{min-height:calc(100dvh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:#000;color:#fff;border-radius:var(--r);padding:32px 24px}
.splash p{color:#aaa}
.splash .btn{max-width:280px}
.logo{font-size:56px;font-weight:900;letter-spacing:.02em;border-bottom:3px solid #fff;padding-bottom:4px}
.check{width:84px;height:84px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:40px}
.splash form{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px;margin-top:20px}
.splash input{background:#1a1a1a;border-color:#333;color:#fff}

/* списки, уровни, аккаунты */
.list{padding:6px 20px}
.w{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.w:last-child{border:0}
.w span{display:block;color:var(--mute);font-size:14px}
.lv{text-align:right;flex:none}
.dots{display:flex;gap:3px;justify-content:flex-end}
.dots i{width:8px;height:8px;border-radius:50%;background:#ddd}
.dots i.on{background:#000}
.lv small{font-size:11px;color:var(--mute)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvb{background:#fff;border:2px solid transparent;border-radius:18px;padding:14px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#000;text-align:center}
.lvb b{font-size:22px}
.lvb span{font-size:12px;font-weight:600;line-height:1.2}
.lvb small{font-size:11px;color:var(--mute)}
.lvb.on{background:#000;color:#fff;border-color:#000}
.field{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:12px}
.field input{width:auto;font-size:17px;padding:8px 12px}
.note{color:var(--mute);font-size:14px;margin:14px 0}
.note b{color:#000}
.form{display:flex;flex-direction:column;gap:8px}
.form input{font-size:16px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:2px solid #000;background:#fff;border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:#000}
.chip.on{background:#000;color:#fff}
.del{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none;color:#000}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.hist .bar{height:6px}
.hist b{width:64px;text-align:right}

/* перевод */
.langs{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:800}
.langs b{flex:1}.langs b:last-child{text-align:right}
.swap{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:18px;cursor:pointer;color:#000}
.trrow{display:flex;gap:10px}
.mic{flex:none;width:60px;border:0;border-radius:16px;background:#000;color:#fff;display:grid;place-items:center;cursor:pointer}
.mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(214,69,69,.25)}}
.tr p{color:#aaa;margin:6px 0 16px}

nav{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:calc(100% - 20px)}
nav[hidden]{display:none}
nav a{padding:10px 13px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
nav a.on{background:#000;color:#fff}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#000;color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .3s;z-index:9;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>
<nav hidden></nav>
<div id="toast"></div>
<script src="words.js"></script>
<script>
const LEVELS = { A1: 'Начальный', A2: 'Базовый', B1: 'Средний', B2: 'Выше среднего', C1: 'Продвинутый', C2: 'Для эссе' };
const WORDS = {}; // kz → { kz, ru, l }; l = уровень или 'my' для своих слов
for (const l in LIB) for (const line of LIB[l].trim().split('\n')) { const [kz, ru] = line.split('|'); WORDS[kz] = { kz, ru, l }; }
// Через сколько дней проверять слово: индекс = сколько раз подряд был верный ответ
const INT = [1, 3, 7, 14, 30, 60, 120];
const PER_LEVEL = 5, PER_DAY = [1, 2, 3, 5, 10];
const perDay = () => S.perDay || 3;
// Иконки: 24×24, линия 2px, цвет = currentColor
const ICONS = {
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
  flame: '<path d="M12 3c.8 3.6 5 5.6 5 10.2A5 5 0 0 1 7 13.2c0-2.3 1-3.9 2.4-5 .3 1.7 1.1 2.7 2.1 3C11.1 8.8 11.2 5.8 12 3z"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/>',
  cards: '<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  quiz: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/>',
  swap: '<path d="M4 8h15l-4-4M20 16H5l4 4"/>',
  left: '<path d="M15 5l-7 7 7 7"/>',
  right: '<path d="M9 5l7 7-7 7"/>',
  shuffle: '<path d="M3 7h3c4.5 0 6.5 10 11 10h3M3 17h3c1.6 0 2.8-1.3 3.8-3M14.2 10C15.2 8.3 16.4 7 18 7h2M17 4l3 3-3 3M17 14l3 3-3 3"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
const ic = (n, s = 20) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LANG = { ru: 'Русский', kk: 'Қазақша' };
const TG = window.Telegram?.WebApp, inTG = !!TG?.initData;
if (inTG) { TG.ready(); TG.expand(); TG.setHeaderColor?.('#ececec'); TG.setBackgroundColor?.('#ececec'); }
const haptic = t => TG?.HapticFeedback?.notificationOccurred(t);
const confirmBox = t => inTG && TG.showConfirm ? new Promise(r => TG.showConfirm(t, r)) : Promise.resolve(confirm(t));

const $ = s => document.querySelector(s);
const app = $('#app'), nav = $('nav');
const day = (n = 0) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); };
const streak = (days = []) => { const s = new Set(days); let n = 0, i = s.has(day()) ? 0 : -1; while (s.has(day(i))) n++, i--; return n; };
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const daysUntil = d => Math.round((new Date(d) - new Date(day())) / 864e5);
const fmtDate = d => new Date(d + 'T12:00').toLocaleDateString('ru', { day: 'numeric', month: 'short' });
const KEYS = `<div class="keys">${[...'әіңғүұқөһ'].map(ch => `<button type="button" onclick="ins('${ch}')">${ch}</button>`).join('')}</div>`;

const fresh = () => ({ level: 'A1', remindAt: '20:00', cards: {}, days: [], custom: {}, history: [] });
let S = fresh(), ME = {}, KIDS = [], Q, P, F, M, from = 'ru', scope = 'all';
let token = localStorage.getItem('token') || '';
const setToken = t => { token = t; t ? localStorage.setItem('token', t) : localStorage.removeItem('token'); };

const myWords = () => Object.keys(S.cards).filter(k => WORDS[k] && !S.cards[k].known);
const dueList = () => myWords().filter(k => S.cards[k].due <= day());
const todayWords = () => S.daily?.date === day() ? S.daily.words.filter(k => S.cards[k] && !S.cards[k].known) : [];
const scopeWords = () => scope === 'today' ? todayWords() : myWords();
const nextWord = () => Object.values(WORDS).find(w => w.l === S.level && !S.cards[w.kz] && !S.daily?.words.includes(w.kz));

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'x-token': token, 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw r.status === 401 ? 401 : (j.error || r.status);
  return j;
}
async function load() {
  ME = await api('GET', '/api/me');
  S = { ...fresh(), ...ME.data };
  for (const kz in S.custom) WORDS[kz] ||= { kz, ru: S.custom[kz], l: 'my' };
  if (ME.role === 'parent') KIDS = await api('GET', '/api/children');
  const items = ME.role === 'parent' ? [['home', 'Ученики'], ['settings', 'Профиль']]
    : [['home', 'Главная'], ['practice', 'Практика'], ['tr', 'Перевод'], ['settings', 'Профиль']];
  nav.innerHTML = items.map(([h, t]) => `<a href="#${h}">${t}</a>`).join('');
}
// ponytail: последняя запись побеждает; устройства синхронизируются при возврате во вкладку
const save = () => ME.role === 'student' && api('PUT', '/api/data', S).catch(() => toast('Не сохранилось — проверь интернет'));
const report = body => api('POST', '/api/report', body).catch(() => {});

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2500); }
function view(html, withNav) { app.innerHTML = html; nav.hidden = !withNav; scrollTo(0, 0); }
function markToday() { const first = !S.days.includes(day()); if (first) S.days.push(day()); return first; }
const topBar = (back, pct, label) => `<div class="top"><a href="${back}" class="x" aria-label="Закрыть">${ic('close', 18)}</a><div class="bar"><i style="width:${pct * 100}%"></i></div><span class="label">${label}</span></div>`;
const splash = (icon, title, text, buttons) => view(`<div class="splash">${icon ? `<div class="check">${icon}</div>` : ''}<h1>${title}</h1><p>${text}</p>${buttons}</div>`);
const homeBtn = '<a class="btn ghost" href="#home">На главную</a>';

// ---------- уровень ----------
const levelButtons = (mark = true) => Object.keys(LEVELS).map(l => {
  const all = Object.values(WORDS).filter(w => w.l === l), got = all.filter(w => S.cards[w.kz]).length;
  return `<button class="lvb${mark && S.level === l ? ' on' : ''}" onclick="pickLevel('${l}')"><b>${l}</b><span>${LEVELS[l]}</span><small>${got}/${all.length}</small></button>`;
}).join('');
function pickLevel(l) {
  S.level = l; S.onboarded = true;
  if (S.daily?.date === day()) S.daily.words = S.daily.words.filter(k => S.cards[k]); // невыученные слова дня — с нового уровня
  save(); toast(`Уровень ${l} · ${LEVELS[l]}`);
  if (location.hash === '#test') location.hash = '#home'; else go();
}
function onboarding() {
  view(`<header class="head"><div><h1>Привет, ${esc(ME.name)}!</h1><p>Какой у тебя уровень казахского?</p></div></header>
    <div class="levels">${levelButtons(false)}</div>
    <div class="label sec">Сколько слов в день учить</div>${perDayButtons()}
    <a class="card cta" href="#test"><span class="label">Не знаешь уровень?</span><h2>Определить по словам</h2>
      <p>Переведи несколько слов — тест сам подберёт уровень</p><span class="btn">Пройти тест</span></a>`);
}
// Тест: по 5 слов с каждого уровня, начиная с A1. Две ошибки на уровне — это и есть твой уровень.
function test() { P = { i: 0, n: 0, right: 0, used: new Set() }; pq(); }
function pq() {
  const ls = Object.keys(LEVELS), back = S.onboarded ? '#settings' : '#home';
  if (P.n - P.right >= 2 || P.n === PER_LEVEL) {
    if (P.n - P.right < 2 && P.i < ls.length - 1) { P.i++; P.n = P.right = 0; }
    else {
      const l = ls[P.i];
      return view(`<div class="splash"><span class="label">Твой уровень</span><div class="logo">${l}</div><p>${LEVELS[l]}</p>
        <button class="btn light" onclick="pickLevel('${l}')">Учить этот уровень</button><a class="btn ghost" href="${back}">Выбрать вручную</a></div>`);
    }
  }
  const l = ls[P.i], w = shuffle(Object.values(WORDS).filter(x => x.l === l && !P.used.has(x.kz)))[0];
  P.used.add(w.kz);
  mc(topBar(back, (P.i * PER_LEVEL + P.n) / (ls.length * PER_LEVEL), l), w, false, ok => { P.n++; if (ok) P.right++; pq(); }, true);
}

// ---------- слова дня ----------
const moreLabel = () => `Ещё ${perDay()} ${plural(perDay(), 'слово', 'слова', 'слов')}`;
const perDayButtons = () => `<div class="seg">${PER_DAY.map(n => `<button class="${perDay() === n ? 'on' : ''}" onclick="setPerDay(${n})">${n}</button>`).join('')}</div>`;
function setPerDay(n) {
  S.perDay = n;
  if (S.daily?.date === day()) { // пересобрать сегодняшний набор: выученное остаётся, лишние невыученные уходят
    const learned = S.daily.words.filter(k => S.cards[k]);
    S.daily.goal = Math.max(n, learned.length);
    S.daily.words = [...learned, ...S.daily.words.filter(k => !S.cards[k])].slice(0, S.daily.goal);
  }
  save(); toast(`${n} ${plural(n, 'слово', 'слова', 'слов')} в день`); go();
}
function daily() {
  let changed = false;
  if (S.daily?.date !== day()) { S.daily = { date: day(), goal: perDay(), words: [], reported: [] }; changed = true; }
  while (S.daily.words.length < S.daily.goal) { const w = nextWord(); if (!w) break; S.daily.words.push(w.kz); changed = true; }
  if (changed) save();
  return S.daily;
}
const pending = d => d.words.filter(k => !S.cards[k]);
const unreported = d => d.words.filter(k => S.cards[k] && !S.cards[k].known && !d.reported.includes(k));

      learnBtn('Продолжить') + '<button class="btn light" onclick="enough()">Хватит на сегодня</button>' + cardsBtn]
    : pend.length ? [`Выучи ${pend.length} ${w(pend.length)}`, n ? 'Иначе стрик сгорит в полночь' : `${perDay()} ${w(perDay())} — и стрик начат`, learnBtn(learnedToday ? 'Продолжить' : 'Учить') + cardsBtn]
    : unrep.length ? ['Осталось закрепить', 'Короткий квиз по новым словам', learnBtn('Закрепить') + cardsBtn]
    : [`Сегодня выполнено ${ic('check', 22)}`, 'Завтра по этим словам будет квиз',

    <section class="card dark">

      <div class="week">${week}</div>

      <h2>${title}</h2><p>${sub}</p>${btns}
    </section>
    <div class="grid">
      <a class="card${due ? ' dark' : ''}" href="#quiz"><span class="label">Квиз</span><div class="num">${due}</div>

      <a class="card" href="#practice"><span class="label">Практика</span><div class="num">${myWords().length}</div>

function learn() {
  const d = daily(), pend = pending(d);
  if (!pend.length) {
    const batch = unreported(d);
    if (batch.length) return startQuiz(batch, { title: 'Закрепим', back: '#home', onDone: () => finishDaily(batch) });

function knowDaily(kz) {

}
function learnedDaily(kz) { S.cards[kz] = { box: 0, due: day(INT[0]) }; save(); learn(); }
function finishDaily(batch) {
  const d = daily();

    (nextWord() ? '<a class="btn light" href="#more">' + moreLabel() + '</a>' : '') + homeBtn);

function enough() { const d = S.daily; d.words = d.words.filter(k => S.cards[k]); d.goal = d.words.length; save(); home(); }

// ---------- квиз-движок ----------
// steps: 1 — только выбор, 2 — выбор, потом письмо (как «Заучивание» в Quizlet). srs: двигать интервалы повторения.
function startQuiz(list, o) {
  Q = { queue: shuffle(list), total: list.length, steps: 1, st: {}, first: {}, back: '#practice', ...o };
  ask();
}
const score = () => Object.values(Q.first).filter(Boolean).length;
function ask() {
  if (!Q.queue.length) return Q.onDone();
  const kz = Q.queue[0], w = WORDS[kz], stage = Q.st[kz] || 0;
  const done = Object.values(Q.st).reduce((a, b) => a + b, 0);
  const head = topBar(Q.back, done / (Q.total * Q.steps), Q.title);
  const write = Q.srs ? S.cards[kz].box >= 2 : stage === 1;
  write ? writeQ(head, w, answer) : mc(head, w, Math.random() < .5, answer);
}
function answer(ok) {
  const kz = Q.queue.shift();
  if (!(kz in Q.first)) {
    Q.first[kz] = ok;
    if (Q.srs) { const c = S.cards[kz]; c.box = ok ? Math.min(c.box + 1, INT.length - 1) : 0; c.due = day(INT[c.box]); save(); }
  }
  if (ok) Q.st[kz] = (Q.st[kz] || 0) + 1;
  if ((Q.st[kz] || 0) < Q.steps) Q.queue.push(kz);
  ask();
}
// Вопрос с 4 вариантами; done(ok) вызывается один раз
function mc(head, w, toKz, done, canSkip) {
  let pool = Object.values(WORDS).filter(x => x.l === w.l && x.kz !== w.kz);
  if (pool.length < 3) pool = Object.values(WORDS).filter(x => x.kz !== w.kz);
  const opts = shuffle([w, ...shuffle(pool).slice(0, 3)]);
  mc.done = done;
  view(head + `<div class="card q"><span class="label">${toKz ? 'Как по-казахски?' : 'Что значит?'}</span><div class="big">${esc(toKz ? w.ru : w.kz)}</div></div>
    <div id="opts">${opts.map(o => `<button class="opt" data-k="${esc(o.kz)}">${esc(toKz ? o.kz : o.ru)}</button>`).join('')}</div>
    <div id="fb">${canSkip ? '<button class="btn ghost" onclick="mc.done(false)">Не знаю</button>' : ''}</div>`);
  $('#opts').onclick = e => {
    const b = e.target.closest('.opt');
    if (!b) return;
    $('#opts').classList.add('lock');
    const ok = b.dataset.k === w.kz;
    haptic(ok ? 'success' : 'error');
    b.classList.add(ok ? 'ok' : 'bad');
    if (ok) { $('#fb').innerHTML = ''; return setTimeout(() => done(true), 600); }
    [...document.querySelectorAll('.opt')].find(o => o.dataset.k === w.kz).classList.add('ok');
    $('#fb').innerHTML = '<button class="btn" id="nx" onclick="mc.done(false)">Дальше</button>';
  };
}
// Вписать слово по-казахски
function writeQ(head, w, done) {
  view(head + `<div class="card q"><span class="label">Напиши по-казахски</span><div class="big">${esc(w.ru)}</div></div>
    <form id="f"><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ответ…">
    ${KEYS}<div id="fb"></div><button class="btn" id="go">Проверить</button></form>`);
  const inp = $('#inp');
  inp.focus();
  let res = null;
  writeQ.done = done;
  $('#f').onsubmit = e => {
    e.preventDefault();
    if (res !== null) return done(res);
    if (!norm(inp.value)) return;
    res = norm(inp.value) === norm(w.kz);
    haptic(res ? 'success' : 'error');
    inp.readOnly = true;
    $('.keys').remove();
    if (res) { $('#fb').innerHTML = '<div class="fb good">Верно!</div>'; return setTimeout(() => done(true), 700); }
    $('#fb').innerHTML = `<div class="fb wrong">Правильно: <b>${esc(w.kz)}</b></div>`;
    $('#go').textContent = 'Дальше';
    $('#go').insertAdjacentHTML('beforebegin', '<button type="button" class="btn light" style="margin-bottom:10px" onclick="writeQ.done(true)">Засчитать как верно</button>');
  };
}
function ins(ch) { const i = $('#inp'); if (i.readOnly) return; i.setRangeText(ch, i.selectionStart, i.selectionEnd, 'end'); i.focus(); }

// Квиз дня: слова, которым пора на проверку (вчерашние и старые). Баллы уходят родителю.

}
function quizDone() {

function cards(back = '#practice') {
  const list = scopeWords();
  if (!list.length) return noWords();
  F = { list: scope === 'today' ? list : shuffle(list), i: 0, back };
  card();
}
function card(step = 0) {
  F.i = (F.i + step + F.list.length) % F.list.length;
  const w = WORDS[F.list[F.i]];
  view(topBar(F.back, (F.i + 1) / F.list.length, `${F.i + 1}/${F.list.length}`) + `

    <div class="label sec">${scope === 'today' ? 'Слова за сегодня' : 'Все слова'} · ${F.list.length}</div>

function match() {
  const list = shuffle(scopeWords()).slice(0, 6);
  if (list.length < 2) return splash('', 'Мало слов', 'Для подбора нужно хотя бы 2 выученных слова', '<a class="btn ghost" href="#practice">Назад</a>');
  const tiles = shuffle(list.flatMap(k => [{ k, t: k }, { k, t: WORDS[k].ru }]));
  M = { left: list.length, start: Date.now(), sel: null };
  view(`<div class="top"><a href="#practice" class="x" aria-label="Закрыть">${ic('close', 18)}</a><span class="label" style="flex:1">Подбор — найди пары</span><b id="mt">0.0 с</b></div>
    <div class="tiles">${tiles.map(x => `<button class="tile" data-k="${esc(x.k)}">${esc(x.t)}</button>`).join('')}</div>`);
  const timer = setInterval(() => { const el = $('#mt'); if (!el) return clearInterval(timer); el.textContent = ((Date.now() - M.start) / 1000).toFixed(1) + ' с'; }, 100);
  $('.tiles').onclick = e => {
    const b = e.target.closest('.tile');
    if (!b) return;
    if (!M.sel || M.sel === b) { b.classList.toggle('sel'); M.sel = M.sel ? null : b; return; }
    const a = M.sel; M.sel = null; a.classList.remove('sel');
    if (a.dataset.k !== b.dataset.k) {
      haptic('error'); M.start -= 1000; // штраф +1 секунда
      return [a, b].forEach(x => { x.classList.add('miss'); setTimeout(() => x.classList.remove('miss'), 400); });
    }
    haptic('success');
    a.classList.add('gone'); b.classList.add('gone');
    if (--M.left) return;
    clearInterval(timer);
    const t = +((Date.now() - M.start) / 1000).toFixed(1), rec = !S.bestMatch || t < S.bestMatch;
    if (rec) { S.bestMatch = t; save(); }
    splash(ic(rec ? 'trophy' : 'check', 40), `${t} с`, rec ? 'Новый рекорд!' : `Рекорд: ${S.bestMatch} с`, '<button class="btn light" onclick="go()">Ещё раз</button><a class="btn ghost" href="#practice">Назад</a>');
  };
}

function listen() {

  r.onerror = e => toast({ 'not-allowed': 'Разреши доступ к микрофону', 'language-not-supported': 'Браузер не распознаёт казахский — попробуй Chrome', 'no-speech': 'Ничего не слышно' }[e.error] || 'Не удалось распознать');
  r.onend = () => { mic.classList.remove('rec'); if (inp.isConnected && inp.value.trim()) translate(); };
  mic.classList.add('rec');

async function translate() {
  const q = $('#inp').value.trim().toLowerCase(), box = $('#tres'), dir = from;
  if (!q) return;
  const n = norm(q);
  const w = Object.values(WORDS).find(w => dir === 'kk' ? norm(w.kz) === n : w.ru.split(/[;,]/).some(p => norm(p.replace(/\(.*?\)/g, '')) === n));
  let kz, ru, src;
  if (w) [kz, ru, src] = [w.kz, w.ru, w.l === 'my' ? 'Твоё слово' : `Из библиотеки · ${w.l}`];
  else {
    box.innerHTML = '<div class="card note">Перевожу…</div>';
    try {
      const t = (await api('GET', `/api/translate?from=${dir}&q=${encodeURIComponent(q)}`)).text.toLowerCase();
      [kz, ru, src] = dir === 'ru' ? [t, q, 'Google Переводчик'] : [q, t, 'Google Переводчик'];
    } catch { box.innerHTML = ''; return toast('Перевод сейчас недоступен'); }
  }
  const has = S.cards[kz] && !S.cards[kz].known;
  box.innerHTML = `<div class="card dark tr"><span class="label">${src}</span><div class="big">${esc(dir === 'ru' ? kz : ru)}</div><p>${esc(dir === 'ru' ? ru : kz)}</p>
    ${has ? `<span class="label">${ic('check', 14)} Уже в твоих словах</span>` : `<button class="btn" id="add">${ic('plus', 16)} Учить это слово</button>`}</div>`;
  if (!has) $('#add').onclick = () => {
    if (!WORDS[kz]) { S.custom[kz] = ru; WORDS[kz] = { kz, ru, l: 'my' }; }
    S.cards[kz] = { box: 0, due: day(INT[0]) };
    save(); toast('Добавлено — завтра будет в квизе'); translate();
  };
}

// ---------- родитель ----------
function parentHome() {
  view(`<header class="head"><div><h1>Ученики</h1><p>${esc(ME.name)} · кабинет родителя</p></div></header>
    ${ME.tg ? '' : `<div class="card"><b>Подключи Telegram</b><p class="note">Туда будут приходить баллы за квизы и напоминания.</p>${tgButton()}</div>`}
    ${KIDS.length ? KIDS.map(k => {
      const d = { cards: {}, days: [], history: [], ...k.data }, n = streak(d.days);
      const learned = Object.values(d.cards).filter(c => !c.known).length, today = d.days.includes(day());
      const last = d.history[0];
      return `<section class="card dark"><span class="label">${esc(k.name)}</span>
          <div class="huge">${n} <small>${plural(n, 'день', 'дня', 'дней')} подряд</small></div>
          <div class="stats"><div><b>${today ? ic('check', 22) : '—'}</b>сегодня</div><div><b>${learned}</b>${plural(learned, 'слово', 'слова', 'слов')}</div>
            <div><b>${last ? `${last.right}/${last.total}` : '—'}</b>последний квиз</div><div><b>${d.level || 'A1'}</b>уровень</div></div></section>
        ${d.history.length ? `<div class="card list">${d.history.slice(0, 7).map(h => `<div class="hist"><span style="width:60px">${fmtDate(h.date)}</span>
          <div class="bar"><i style="width:${h.right / h.total * 100}%"></i></div><b>${h.right}/${h.total}</b></div>`).join('')}</div>` : ''}`;
    }).join('') : '<div class="card note" style="margin:0">Пока нет привязанных учеников — попроси администратора привязать.</div>'}`, true);
}

// ---------- профиль ----------
const tgButton = () => ME.tgLink ? `<a class="btn" href="${ME.tgLink}" target="_blank" onclick="if(inTG){event.preventDefault();TG.openTelegramLink(this.href)}">Подключить Telegram</a>`
  : '<p class="note">Бот не настроен на сервере (нет BOT_TOKEN).</p>';
function settings() {
  const tgBlock = `<div class="label sec">Telegram</div><div class="card">
    ${ME.role === 'student' ? `<label class="field">Время напоминания<input type="time" value="${S.remindAt}" onchange="S.remindAt=this.value;save();toast('Сохранено')"></label>` : ''}
    <p class="note">${ME.tg ? `${ic('check', 16)} Подключён. ${ME.role === 'parent' ? 'Сюда придут баллы за квизы и напоминания.' : 'Напомню, если слова дня не выучены.'}` : 'Telegram не подключён.'}</p>
    ${ME.tg ? '<button class="btn light" onclick="testTg()">Отправить тест</button>' : tgButton()}
    ${ME.admin ? `<p class="note" style="margin-bottom:0">Mini App: ${ME.miniApp ? `кнопка «kz-quiz» в боте открывает ${esc(ME.miniApp)}` : 'не подключён — сайт должен открываться по https:// и на сервере должен быть BOT_TOKEN'}</p>` : ''}</div>`;
  view(`<header class="head"><div><h1>Профиль</h1><p>${esc(ME.name)} · ${esc(ME.login)}</p></div></header>
    ${ME.role === 'student' ? `<div class="label sec">Уровень</div><div class="levels">${levelButtons()}</div>
      <a class="btn light" href="#test">Определить уровень по словам</a>
      <div class="label sec">Слов в день</div>${perDayButtons()}` : ''}
    ${tgBlock}
    ${ME.admin ? `<div class="label sec">Аккаунты</div><div class="card list" id="acc"><p class="note">Загрузка…</p></div>
      <form class="card form" id="nu"><b>Новый аккаунт</b>
        <input name="name" placeholder="Имя (как в уведомлениях)">
        <input name="login" placeholder="Логин латиницей" autocapitalize="off" autocomplete="off">
        <input name="pass" placeholder="Пароль" autocomplete="new-password">
        <div class="seg"><label><input type="radio" name="role" value="student" checked>Ученик</label><label><input type="radio" name="role" value="parent">Родитель</label></div>
        <button class="btn">Создать</button>
        <p class="note" style="margin:0">Если такой логин уже есть — у него обновятся имя и пароль.</p></form>` : ''}
    ${ME.role === 'student' ? '<button class="btn light" style="margin-top:12px" onclick="resetProgress()">Сбросить прогресс</button>' : ''}
    <button class="btn ghost" style="margin-top:12px" onclick="logout()">Выйти</button>`, true);
  if (!ME.admin) return;
  accounts();
  $('#nu').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { await api('POST', '/api/admin', { op: 'save', ...f }); e.target.reset(); toast('Сохранено'); accounts(); }
    catch (err) { toast(typeof err === 'string' ? err : 'Не получилось'); }
  };
}
let ACC = [];
async function accounts() {
  ACC = await api('GET', '/api/admin');
  const kids = ACC.filter(x => x.role === 'student');
  $('#acc').innerHTML = ACC.map(x => `<div class="w"><div><b>${esc(x.name)}</b>
    <span>${x.login} · ${x.role === 'parent' ? 'родитель' : 'ученик'}${x.admin ? ' · админ' : ''}${x.tg ? ' · Telegram подключён' : ''}</span>
    ${x.role === 'parent' ? `<div class="chips">${kids.map(s => `<button class="chip${x.children.includes(s.login) ? ' on' : ''}" onclick="toggleKid('${x.login}','${s.login}')">${esc(s.name)}</button>`).join('')}</div>` : ''}</div>
    ${x.login !== ME.login ? `<button class="del" onclick="delUser('${x.login}')" aria-label="Удалить">${ic('close', 16)}</button>` : ''}</div>`).join('');
}
async function toggleKid(p, s) {
  const c = ACC.find(a => a.login === p).children;
  await api('POST', '/api/admin', { op: 'save', login: p, children: c.includes(s) ? c.filter(x => x !== s) : [...c, s] }).catch(() => toast('Не получилось'));
  accounts();
}
async function delUser(l) {
  if (!await confirmBox(`Удалить аккаунт ${l}? Его прогресс пропадёт.`)) return;
  await api('POST', '/api/admin', { op: 'delete', login: l }).catch(() => toast('Не получилось'));
  accounts();
}
async function resetProgress() {
  if (!await confirmBox('Стереть все выученные слова, слова дня и историю квизов? Уровень, стрик и настройки останутся.')) return;
  Object.assign(S, { cards: {}, custom: {}, history: [], daily: null });
  save(); toast('Прогресс сброшен'); location.hash = '#home';
}
const testTg = () => api('POST', '/api/test').then(() => toast('Отправлено'), e => toast(typeof e === 'string' ? e : 'Не получилось'));
async function logout() {
  await api('POST', '/api/logout', { unlink: inTG }).catch(() => {});
  setToken(''); location.hash = ''; location.reload();
}

function login() {
  view(`<div class="splash"><div class="logo">kz-quiz</div><p>казахский каждый день</p>
    <form id="lf"><input name="login" placeholder="Логин" autocapitalize="off" autocomplete="username">
      <input name="pass" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn light">Войти</button></form></div>`);
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { setToken((await api('POST', '/api/login', { ...f, initData: TG?.initData })).token); boot(); }
    catch (err) { toast(typeof err === 'string' ? err : 'Неверный логин или пароль'); }
  };
}

// ---------- запуск ----------
const routes = { home, learn, more, today: todayCards, quiz, practice, cards, drill, match, tr, settings, test };
function go() {
  const r = location.hash.slice(1);
  if (ME.role === 'parent') (r === 'settings' ? settings : parentHome)();
  else if (!S.onboarded && !Object.keys(S.cards).length && r !== 'test' && r !== 'settings') return onboarding();
  else (routes[r] || home)();
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.hash === '#' + (routes[r] ? r : 'home')));
}
async function boot() {
  try {
    if (!token && inTG) {
      const r = await fetch('/api/tglogin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ initData: TG.initData }) });
      if (r.ok) setToken((await r.json()).token);
    }
    if (!token) return login();
    await load(); go();
  } catch (e) {
    if (e === 401) { setToken(''); return login(); }
    view('<div class="splash"><h1>Сервер недоступен</h1><button class="btn light" onclick="boot()">Ещё раз</button></div>');
  }
}
addEventListener('hashchange', go);
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !token) return;
  load().then(() => ['', 'home', 'practice', 'settings'].includes(location.hash.slice(1)) && go()).catch(() => {});
});
addEventListener('keydown', e => { // ПК: 1–4 — варианты, пробел — перевернуть, стрелки — листать, Enter — дальше
  if (e.target.tagName === 'INPUT') return;
  const o = document.querySelectorAll('.opt')[e.key - 1];
  if (o) return o.click();
  if (e.key === ' ' && $('.flip')) { e.preventDefault(); $('.flip').classList.toggle('on'); }
  if ($('#fc') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) card(e.key === 'ArrowRight' ? 1 : -1);
  if (e.key === 'Enter') $('#nx')?.click();
});
boot();
</script>
</body>
</html>
